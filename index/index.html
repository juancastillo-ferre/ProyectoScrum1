<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="index.css">
        <title>Archivos de Lothal</title>
    </head>
    <body>
        <header>
            <h1>Archivos de Lothal</h1>
            <p class="subtitulo">Que la fuerza te acompañe en tu busqueda.</p>
        </header>
        <div class="fondo">
        
        <section class="buscador">
            <h3>Busca a tu astro</h3>

            <form id="formulario">
                <div class="categoria">
                    <select id="selectorCategoria">
                        <option value="">Selecciona una categoría... </option>
                        <option value="people">Personaje</option>
                        <option value="planets">Planeta</option>
                        <option value="starships">Nave</option>
                        <option value="films">Película</option>
                        <option value="species">Especie</option>
                        <option value="vehicles">Vehículo</option>
                        <option value="all">Todos</option>
                    </select>
                </div>

                <div class="busqueda">
                    <input type="text" placeholder="Escribe el nombre de tu astro..." id="busqueda">
                </div>
                <section id="filtrosSection">
                    <h3 id="filtrosTitle">Filtros de personajes</h3>
                    <div class="filtros-dinamicos" id="filtrosContainer">
                    
                    </div>
                </section>
                <button type="submit" id="boton-buscar">Buscar</button>
            </form>
        </section>

        <section class="resultados">
            <h2>Personajes encontrados</h2>

            <div id="fichasContainer">
                
            </div>
        </section>
    </div>

        <div id="modalFons" onclick="tancarModalExtern(event)">
            <div id="fichaDetallada">
                <span id="cerrarModal" onclick="tancarModal()">&times;</span>

                <h2 id="nombreElemento"></h2>
                <div class="información">
                    <ul id="llistaDades"></ul>
                </div>
                <div class="imagen">
                    <img id="imagenElemento" src="" alt="imagen elemento">
                </div>
            </div>
        </div>

        <script src="index.js" defer></script>
    </body>
</html>
